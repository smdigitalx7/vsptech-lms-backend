[project]
name = "fastapi-docker-template"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic[email]>=2.11.0",
    "pydantic-settings==2.10.1",
    "fastapi==0.116.1",
    "starlette==0.47.2",
    "uvicorn==0.35.0",
    "httptools==0.6.4",
    "greenlet==3.2.4",
    "alembic==1.16.5",
    "asyncpg==0.30.0",
    "PyJWT==2.10.1",
    "sqlalchemy==2.0.43",
    "python-multipart==0.0.20",
    "redis==5.3.1",
    "arq==0.26.3",
    "argon2-cffi>=23.1.0",
    "psycopg2-binary==2.9.10",
    "gunicorn==23.0.0",
    "httpx>=0.25.0",
    "validators>=0.22.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.2",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "fakeredis>=2.18.0",
    "factory-boy>=3.3.0",
    "faker>=26.0.0",
    "types-redis>=4.6.0",
    "ruff>=0.11.13",
    "mypy>=1.16.0"
]
unix = [
    "uvloop>=0.19.0",
]
windows = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/"]

[tool.hatch.build.targets.wheel]
include = ["src/"]
packages = ["src/app"]

[tool.ruff]
target-version = "py313"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    "F",  # Pyflakes
    "E",  # pycodestyle
    "W",  # Warning
    "C",  # Complexity (mccabe+) & comprehensions
    "UP",  # pyupgrade
    "I",  # isort
]
ignore = [
    "E402",  # module level import not at top of file
    "UP006",  # use-pep585-annotation
    "UP007",  # use-pep604-annotation
    "E741",  # Ambiguous variable name
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",  # unused import
    "F403",  # star imports
]

[tool.ruff.lint.mccabe]
max-complexity = 24

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::PendingDeprecationWarning:starlette.formparsers",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "src.app.*"
disallow_untyped_defs = true

