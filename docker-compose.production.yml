version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: fastapi-app:prod
    container_name: fastapi-web
    command: >
      sh -c "gunicorn src.app.main:app
      -w $${GUNICORN_WORKERS:-4}
      -k uvicorn.workers.UvicornWorker
      --threads $${GUNICORN_THREADS:-2}
      -b 0.0.0.0:8000
      --access-logfile -
      --error-logfile -
      --log-level info
      --max-requests $${GUNICORN_MAX_REQUESTS:-500}
      --max-requests-jitter $${GUNICORN_MAX_REQUESTS_JITTER:-25}
      --timeout $${GUNICORN_TIMEOUT:-120}
      --graceful-timeout $${GUNICORN_GRACEFUL_TIMEOUT:-30}
      --keep-alive $${GUNICORN_KEEP_ALIVE:-5}"
    env_file:
      - ./.env.production
    depends_on:
      - redis
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1.5G
          cpus: '0.7'
        reservations:
          memory: 1G
          cpus: '0.4'
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - webnet
    extra_hosts:
      - "db-server:72.60.218.92"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: fastapi-redis
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.2'
        reservations:
          memory: 256M
          cpus: '0.1'
    restart: unless-stopped
    networks:
      - webnet
    command: >
      redis-server --maxmemory 256mb
                   --maxmemory-policy allkeys-lru
                   --appendonly yes
                   --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    image: fastapi-app:prod
    container_name: fastapi-worker
    command: arq src.app.core.worker.settings.WorkerSettings
    env_file:
      - ./.env.production
    depends_on:
      - redis
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512M
          cpus: '0.2'
        reservations:
          memory: 256M
          cpus: '0.1'
    restart: unless-stopped
    networks:
      - webnet
    extra_hosts:
      - "db-server:72.60.218.92"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq.*WorkerSettings' > /dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  redis_prod_data:
    driver: local

networks:
  webnet:
    driver: bridge
