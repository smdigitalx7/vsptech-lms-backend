
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: testverse-dev:dev
    container_name: testverse-dev-web
    command: >
      sh -c "uvicorn src.app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src
      --log-level debug"
    env_file:
      - ./.env
    environment:
      - ENVIRONMENT=local
      - DEBUG=true
    depends_on:
      - redis
    volumes:
      # Mount source code for hot-reloading
      - ./src:/app/src:ro
      # Mount logs directory for development
      - ./logs:/app/logs
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - testverse-dev-net
    extra_hosts:
      - "db-server:72.60.218.92"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: testverse-dev-redis
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    networks:
      - testverse-dev-net
    command: >
      redis-server --maxmemory 128mb
                   --maxmemory-policy allkeys-lru
                   --appendonly yes
                   --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 60s
      timeout: 10s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: testverse-dev:dev
    container_name: testverse-dev-worker
    command: arq src.app.core.worker.settings.WorkerSettings
    env_file:
      - ./.env
    environment:
      - ENVIRONMENT=local
      - DEBUG=true
    depends_on:
      - redis
    volumes:
      # Mount source code for development
      - ./src:/app/src:ro
      # Mount logs directory for development
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - testverse-dev-net
    extra_hosts:
      - "db-server:72.60.218.92"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'arq.*WorkerSettings' > /dev/null || exit 1"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis_dev_data:
    driver: local

networks:
  testverse-dev-net:
    driver: bridge
